name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Runs on the self-hosted runner installed on the Service-Rechner.
    # The runner must be registered with this repository.
    # See README.md → "GitHub Actions Self-Hosted Runner einrichten"
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy build to backend static dir
        # Copies the built frontend into the directory FastAPI serves as StaticFiles.
        # Adjust the destination path if your backend uses a different STATIC_DIR.
        run: |
          mkdir -p /opt/go2-dashboard/frontend/dist
          rsync -a --delete frontend/dist/ /opt/go2-dashboard/frontend/dist/

      - name: Install / update backend dependencies
        working-directory: backend
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          MOCK_MODE: "true"
        run: python3 -m pytest tests/ -v

      - name: Restart backend service
        # Requires the backend to be installed as a systemd service.
        # See README.md → "Backend als systemd-Service einrichten"
        # Remove or adjust this step if you manage the backend differently.
        run: |
          if systemctl is-enabled go2-backend.service &>/dev/null; then
            sudo systemctl restart go2-backend.service
            echo "Backend service restarted."
          else
            echo "go2-backend.service not found – skipping restart. Start the backend manually."
          fi
